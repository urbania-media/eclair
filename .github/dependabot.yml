version: 2
updates:
    # The Node base image of docker/Dockerfile, pinned by digest.
    - package-ecosystem: docker
      directory: /docker
      schedule:
          interval: weekly
      ignore:
          # A new major of Node moves with .nvmrc, CI and the smoke test, in its own change.
          - dependency-name: node
            update-types: ['version-update:semver-major']

    # GitHub Actions, some of them pinned to a commit.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
