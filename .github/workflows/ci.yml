name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    checks:
        name: Format, lint, typecheck and build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Build
              run: npm run build

            - name: Check for a changeset
              if: github.event_name == 'pull_request'
              run: npx changeset status --since=origin/${{ github.base_ref }}

    test:
        name: Test on ${{ matrix.database.name }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                # The oldest supported version of each database server (see decision 0007). SQLite
                # comes with Node and needs no service: an empty image starts no container.
                database:
                    - name: MySQL 8.4
                      dialect: mysql
                      image: mysql:8.4
                      port: 3306
                      url: mysql://eclair:eclair@127.0.0.1:3306/eclair
                      health: mysqladmin ping --host 127.0.0.1 --user eclair --password=eclair
                    - name: PostgreSQL 15
                      dialect: postgres
                      image: postgres:15
                      port: 5432
                      url: postgres://eclair:eclair@127.0.0.1:5432/eclair
                      health: pg_isready --host 127.0.0.1 --username eclair --dbname eclair
                    - name: SQLite
                      dialect: sqlite
                      image: ''
                      port: 0
                      url: sqlite:///tmp/eclair-test.db
                      health: ''
        services:
            database:
                image: ${{ matrix.database.image }}
                # Each image ignores the other's variables.
                env:
                    MYSQL_DATABASE: eclair
                    MYSQL_USER: eclair
                    MYSQL_PASSWORD: eclair
                    MYSQL_ROOT_PASSWORD: root
                    POSTGRES_DB: eclair
                    POSTGRES_USER: eclair
                    POSTGRES_PASSWORD: eclair
                ports:
                    - ${{ matrix.database.port }}:${{ matrix.database.port }}
                options: >-
                    --health-cmd "${{ matrix.database.health }}"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 30
            # The task queues.
            redis:
                image: redis:8
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 30
            # An S3-compatible service for the s3 storages and the temporary storage.
            s3:
                image: adobe/s3mock:5.2.3
                env:
                    COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: eclair-test
                ports:
                    - 9090:9090
        env:
            DATABASE_URL: ${{ matrix.database.url }}
            ECLAIR_TEST_DIALECT: ${{ matrix.database.dialect }}
            ECLAIR_TEST_REDIS_URL: redis://127.0.0.1:6379
            ECLAIR_TEST_S3_ENDPOINT: http://127.0.0.1:9090
            ECLAIR_TEST_S3_BUCKET: eclair-test
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Wait for the S3 service
              run: |
                  for attempt in $(seq 1 60); do
                      curl -fs -o /dev/null "$ECLAIR_TEST_S3_ENDPOINT/eclair-test" && exit 0
                      sleep 2
                  done
                  echo 'The S3 service did not start.' >&2
                  exit 1

            - name: Test
              run: npm test
