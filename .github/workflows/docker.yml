name: Docker image

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    IMAGE: ghcr.io/urbania-media/eclair
    TEST_TAG: eclair:test

jobs:
    image:
        name: Build, test and scan the image
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7

            # Actions outside of actions/* are pinned to a commit.
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Image tags and labels
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha

            - name: Build
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64
                  load: true
                  tags: ${{ env.TEST_TAG }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test
              run: |
                  docker run --rm -v "$PWD/docker/smoke-test.sh:/smoke-test.sh:ro" \
                      "$TEST_TAG" sh /smoke-test.sh > versions.md

            - name: Smoke test on a read-only file system
              run: |
                  docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
                      -v /tmp/eclair -v /var/lib/eclair \
                      -v "$PWD/docker/smoke-test.sh:/smoke-test.sh:ro" \
                      "$TEST_TAG" sh /smoke-test.sh > /dev/null

            # The compose files, with this image: migrations, the API and a worker, a probe and a job.
            - name: Compose end to end
              run: |
                  docker tag "$TEST_TAG" ghcr.io/urbania-media/eclair:e2e
                  ECLAIR_VERSION=e2e sh docker/e2e.sh compose.yml
                  ECLAIR_VERSION=e2e sh docker/e2e.sh compose.mysql.yml

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Operations run their real binaries: the image's, with the tests of the repository.
            # ECLAIR_TEST_BINARIES makes a missing binary fail instead of skipping its tests.
            - name: Operation tests in the image
              run: |
                  mkdir -p .tmp
                  docker run --rm --user "$(id -u):$(id -g)" --entrypoint node \
                      -e ECLAIR_TEST_BINARIES=1 -e HOME=/src/.tmp -e TMPDIR=/src/.tmp \
                      -e MAGICK_TEMPORARY_PATH=/src/.tmp \
                      -v "$PWD:/src" -w /src "$TEST_TAG" \
                      node_modules/vitest/vitest.mjs run --project 'operations-*'

            - name: Summary
              if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: |
                  size=$(docker image inspect "$TEST_TAG" --format '{{.Size}}')
                  {
                      echo '## Docker image'
                      echo
                      echo "linux/amd64, $(numfmt --to=iec-i --suffix=B --format=%.2f "$size") uncompressed."
                      echo
                      cat versions.md 2>/dev/null || echo 'The smoke test failed before listing the versions.'
                  } | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Scan for vulnerabilities
              id: scan
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.75.0
                  image-ref: ${{ env.TEST_TAG }}
                  scanners: vuln
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: '1'
                  format: table
                  output: trivy.txt

            - name: Vulnerability report
              if: ${{ !cancelled() && hashFiles('trivy.txt') != '' }}
              run: |
                  cat trivy.txt
                  {
                      echo '## Vulnerabilities'
                      echo
                      echo 'High and critical vulnerabilities with a fix available, found by Trivy:'
                      echo
                      echo '```'
                      cat trivy.txt
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Log in to the GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Same build as above, from the cache, with an SBOM and provenance attestations.
            - name: Push
              if: github.event_name != 'pull_request'
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  provenance: mode=max
                  sbom: true
