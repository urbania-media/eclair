# Eclair on a single server, with MySQL and Redis (see docs/deployment.md). From this directory:
#
#   cp .env.example .env    # then fill in the empty values
#   docker compose -f compose.mysql.yml up -d
#   docker compose -f compose.mysql.yml exec eclair eclair migrate
#
# compose.yml does the same with PostgreSQL. Put a reverse proxy with TLS in front of the API.

name: eclair

services:
    eclair:
        image: ghcr.io/urbania-media/eclair:${ECLAIR_VERSION:-latest}
        build:
            context: ..
            dockerfile: docker/Dockerfile
        command: all
        restart: unless-stopped
        env_file: .env
        environment:
            DATABASE_URL: mysql://eclair:${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}@mysql:3306/eclair
            REDIS_URL: redis://redis:6379
        ports:
            - 127.0.0.1:${ECLAIR_PORT:-8080}:${ECLAIR_PORT:-8080}
        volumes:
            - data:/var/lib/eclair
            - tmp:/tmp/eclair
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        # A worker finishes its running tasks when it stops.
        stop_grace_period: 5m
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: eclair
            MYSQL_USER: eclair
            MYSQL_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
            MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test: mysqladmin ping --host 127.0.0.1 --user eclair --password="$$MYSQL_PASSWORD"
            interval: 5s
            timeout: 5s
            retries: 30

    redis:
        image: redis:8
        restart: unless-stopped
        # BullMQ needs Redis to keep every key.
        command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
        volumes:
            - redis:/data
        healthcheck:
            test: [CMD, redis-cli, ping]
            interval: 5s
            timeout: 5s
            retries: 30

volumes:
    data:
    tmp:
    mysql:
    redis:
